# Multi-tenant OAuth2/OIDC/SAML Authentication Provider Configuration
#
# This API acts as an OAuth2 Authorization Server, OpenID Connect Provider,
# and SAML Identity Provider. It supports multiple identity providers and
# multiple identity storage backends per tenant.

# Global identity storage (shared across tenants)
# Tenants can reference these by ID, or define their own tenant-specific storage
identity_storage:
  # Shared PostgreSQL database
  shared-db:
    type: database
    connection_url: "${env:DATABASE_URL:postgresql://localhost:5432/auth_shared}"
    db_type: "postgres"
    users_table: "users"
    id_column: "id"
    email_column: "email"
    attribute_mappings:
      name: "full_name"
      role: "user_role"

  # Shared LDAP/Active Directory
  corporate-ldap:
    type: ldap
    url: "${env:LDAP_URL:ldaps://ldap.example.com:636}"
    bind_dn: "${env:LDAP_BIND_DN:cn=service,dc=example,dc=com}"
    bind_password: "${env:LDAP_BIND_PASSWORD}"
    base_dn: "ou=users,dc=example,dc=com"
    user_filter: "(uid={username})"
    attributes:
      - "uid"
      - "mail"
      - "cn"
      - "displayName"
      - "memberOf"

tenants:
  # Example 1: Multi-Provider Tenant (OAuth2 + OIDC + SAML)
  # Demonstrates multiple identity providers using shared storage
  acme-corp:
    id: acme-corp
    name: "ACME Corporation"
    description: "Multi-protocol authentication provider"
    active: true
    allowed_origins:
      - "https://app.acme-corp.com"
      - "https://dashboard.acme-corp.com"

    # Multiple identity providers (what this service provides to client apps)
    identity_providers:
      # Primary OAuth2/OIDC provider
      default:
        type: oauth2
        issuer: "https://auth.acme-corp.com"
        grant_types:
          - "authorization_code"
          - "client_credentials"
          - "refresh_token"
          - "password"  # Enable password grant
        token_endpoint: "/oauth/token"
        authorize_endpoint: "/oauth/authorize"
        jwks_endpoint: "/.well-known/jwks.json"
        access_token_expiration_secs: 3600      # 1 hour
        refresh_token_expiration_secs: 2592000  # 30 days
        password_grant_enabled: true
        signing_key:
          algorithm: "RS256"
          kid: "acme-corp-2024-01"
          private_key: "${env:OAUTH2_PRIVATE_KEY:/keys/acme-oauth2-private.pem}"
          public_key: "${env:OAUTH2_PUBLIC_KEY:/keys/acme-oauth2-public.pem}"
        # Request Objects support (RFC 9101)
        request_parameter_supported: true
        request_uri_parameter_supported: true
        require_request_uri_registration: false
        request_object_signing_alg_values_supported:
          - "RS256"
          - "ES256"
        # Reference to global shared storage
        identity_storage_id: "shared-db"

      # OIDC provider (can use same or different storage)
      oidc:
        type: oidc
        issuer: "https://auth.acme-corp.com"
        userinfo_endpoint: "/oauth/userinfo"
        claims_supported:
          - "sub"
          - "email"
          - "email_verified"
          - "name"
          - "picture"
        scopes_supported:
          - "openid"
          - "profile"
          - "email"
        id_token_expiration_secs: 3600  # 1 hour
        # ID Token Encryption (JWE) - optional
        encryption_key:
          alg: "RSA-OAEP"
          enc: "A256GCM"
          kid: "acme-enc-2024-01"
          public_key: "${env:ID_TOKEN_ENCRYPTION_PUBLIC_KEY:/keys/acme-id-token-enc-public.pem}"
          # private_key: "/keys/acme-id-token-enc-private.pem"  # Only needed for decryption
        id_token_encryption_alg_values_supported:
          - "RSA-OAEP"
          - "RSA-OAEP-256"
        id_token_encryption_enc_values_supported:
          - "A128GCM"
          - "A192GCM"
          - "A256GCM"
        # Reference to global shared storage
        identity_storage_id: "shared-db"

      # SAML Identity Provider for legacy apps
      saml-legacy:
        type: saml
        entity_id: "https://auth.acme-corp.com/saml"
        sso_url: "/saml/sso"
        slo_url: "/saml/slo"
        certificate: |
          -----BEGIN CERTIFICATE-----
          MIIDXTCCAkWgAwIBAgIJAKxpK...
          -----END CERTIFICATE-----
        private_key: "${env:SAML_PRIVATE_KEY:/keys/acme-saml-private.pem}"
        metadata_endpoint: "/saml/metadata"
        name_id_format: "urn:oasis:names:tc:SAML:1.1:nameid-format:emailAddress"
        # Reference to global LDAP storage
        identity_storage_id: "corporate-ldap"

    # API Key support (optional)
    api_keys:
      enabled: true
      expiration_secs: 0  # 0 = no expiration
      allowed_scopes:
        - "api:read"
        - "api:write"
      signing_key:
        algorithm: "RS256"
        kid: "acme-api-key-2024"
        private_key: "/keys/acme-api-private.pem"
        public_key: "/keys/acme-api-public.pem"

    # OAuth2 Federation providers for "Login with Google/GitHub" (optional)
    # These allow users to authenticate via external OAuth2/OIDC providers
    # We always issue our own tokens - providers are used only for authentication
    federation_providers:
      google:
        provider_type: google
        provider_id: google
        client_id: "${env:GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}"
        client_secret: "${env:GOOGLE_CLIENT_SECRET:your-google-client-secret}"
        # Optional: override default endpoints
        # authorization_endpoint: "https://accounts.google.com/o/oauth2/v2/auth"
        # token_endpoint: "https://oauth2.googleapis.com/token"
        # userinfo_endpoint: "https://www.googleapis.com/oauth2/v3/userinfo"
        scopes:
          - openid
          - profile
          - email

      github:
        provider_type: github
        provider_id: github
        client_id: "${env:GITHUB_CLIENT_ID:your-github-client-id}"
        client_secret: "${env:GITHUB_CLIENT_SECRET:your-github-client-secret}"
        # Optional: override default endpoints
        # authorization_endpoint: "https://github.com/login/oauth/authorize"
        # token_endpoint: "https://github.com/login/oauth/access_token"
        # userinfo_endpoint: "https://api.github.com/user"
        scopes:
          - read:user
          - user:email  # Required to get private emails

  # Example 2: SAML-only tenant with tenant-specific LDAP
  # Demonstrates tenant-specific storage overriding global storage
  globex:
    id: globex
    name: "Globex Corporation"
    description: "SAML Identity Provider with dedicated Active Directory"
    active: true
    allowed_origins:
      - "https://apps.globex.com"

    identity_providers:
      default:
        type: saml
        entity_id: "https://auth.globex.com/saml"
        sso_url: "/saml/sso"
        slo_url: "/saml/slo"
        certificate: |
          -----BEGIN CERTIFICATE-----
          MIIDXTCCAkWgAwIBAgIJAKxpK...
          -----END CERTIFICATE-----
        private_key: "/keys/globex-saml-private.pem"
        metadata_endpoint: "/saml/metadata"
        name_id_format: "urn:oasis:names:tc:SAML:2.0:nameid-format:persistent"
        # Reference to tenant-specific storage
        identity_storage_id: "globex-ad"

    # Tenant-specific identity storage (overrides global)
    identity_storage:
      globex-ad:
        type: ldap
        url: "ldaps://ad.globex.com:636"
        bind_dn: "${env:GLOBEX_LDAP_BIND_DN}"
        bind_password: "${env:GLOBEX_LDAP_BIND_PASSWORD}"
        base_dn: "ou=users,dc=globex,dc=com"
        user_filter: "(sAMAccountName={username})"
        attributes:
          - "sAMAccountName"
          - "mail"
          - "cn"
          - "displayName"
          - "memberOf"

    api_keys:
      enabled: true
      expiration_secs: 31536000  # 1 year
      allowed_scopes:
        - "api:read"
      signing_key:
        algorithm: "ES256"
        kid: "globex-api-2024"
        private_key: "/keys/globex-api-private.pem"
        public_key: "/keys/globex-api-public.pem"

  # Example 3: OAuth2-only tenant with tenant-specific database
  # Demonstrates password grant with dedicated PostgreSQL database
  initech:
    id: initech
    name: "Initech"
    description: "OAuth2 provider with dedicated PostgreSQL database"
    active: true

    identity_providers:
      default:
        type: oauth2
        issuer: "https://auth.initech.com"
        grant_types:
          - "authorization_code"
          - "password"  # Resource Owner Password Credentials
          - "client_credentials"
          - "refresh_token"
        token_endpoint: "/oauth/token"
        authorize_endpoint: "/oauth/authorize"
        jwks_endpoint: "/.well-known/jwks.json"
        access_token_expiration_secs: 7200      # 2 hours
        refresh_token_expiration_secs: 604800   # 7 days
        password_grant_enabled: true
        signing_key:
          algorithm: "RS256"
          kid: "initech-2024"
          private_key: "/keys/initech-private.pem"
          public_key: "/keys/initech-public.pem"
        # Reference to tenant-specific database
        identity_storage_id: "initech-db"

    # Tenant-specific database
    identity_storage:
      initech-db:
        type: database
        connection_url: "${env:INITECH_DATABASE_URL:postgresql://localhost:5432/initech_users}"
        db_type: "postgres"
        users_table: "app_users"
        id_column: "user_id"
        email_column: "email_address"
        attribute_mappings:
          name: "full_name"
          role: "account_type"
          department: "dept_code"

  # Example 4: Simple tenant using only global storage
  # Demonstrates minimal configuration leveraging shared resources
  widgets-inc:
    id: widgets-inc
    name: "Widgets Inc"
    description: "Simple OAuth2 provider using shared infrastructure"
    active: true

    identity_providers:
      default:
        type: oauth2
        issuer: "https://auth.widgets-inc.com"
        grant_types:
          - "authorization_code"
          - "refresh_token"
        token_endpoint: "/oauth/token"
        authorize_endpoint: "/oauth/authorize"
        jwks_endpoint: "/.well-known/jwks.json"
        access_token_expiration_secs: 3600
        refresh_token_expiration_secs: 2592000
        password_grant_enabled: false
        signing_key:
          algorithm: "RS256"
          kid: "widgets-2024"
          private_key: "/keys/widgets-private.pem"
          public_key: "/keys/widgets-public.pem"
        # Uses global shared database
        identity_storage_id: "shared-db"

    # No tenant-specific storage - uses global only

  # Example 5: OAuth2/OIDC tenant with Implicit Flow for SPAs
  # Demonstrates implicit flow (for legacy SPAs) with Request Objects
  spa-example:
    id: spa-example
    name: "SPA Example"
    description: "OAuth2/OIDC provider with implicit flow support for Single Page Applications"
    active: true
    allowed_origins:
      - "https://spa.example.com"
      - "https://app.example.com"

    identity_providers:
      default:
        type: oauth2
        issuer: "https://auth.spa-example.com"
        grant_types:
          - "authorization_code"
          - "implicit"  # Enable implicit flow for SPAs
          - "refresh_token"
        token_endpoint: "/oauth/token"
        authorize_endpoint: "/oauth/authorize"
        jwks_endpoint: "/.well-known/jwks.json"
        access_token_expiration_secs: 3600
        refresh_token_expiration_secs: 2592000
        password_grant_enabled: false
        signing_key:
          algorithm: "RS256"
          kid: "spa-2024"
          private_key: "/keys/spa-private.pem"
          public_key: "/keys/spa-public.pem"
        # Request Objects support (RFC 9101)
        request_parameter_supported: true
        request_uri_parameter_supported: true
        require_request_uri_registration: true  # Require registration for security
        request_object_signing_alg_values_supported:
          - "RS256"
          - "ES256"
        identity_storage_id: "shared-db"

      oidc:
        type: oidc
        issuer: "https://auth.spa-example.com"
        userinfo_endpoint: "/oauth/userinfo"
        claims_supported:
          - "sub"
          - "email"
          - "email_verified"
          - "name"
          - "picture"
        scopes_supported:
          - "openid"
          - "profile"
          - "email"
        id_token_expiration_secs: 3600
        # ID Token Encryption example
        encryption_key:
          alg: "RSA-OAEP"
          enc: "A256GCM"
          kid: "spa-enc-2024"
          public_key: "/keys/spa-id-token-enc-public.pem"
        id_token_encryption_alg_values_supported:
          - "RSA-OAEP"
        id_token_encryption_enc_values_supported:
          - "A256GCM"
        identity_storage_id: "shared-db"

# Storage backend for sessions, tokens, etc.
# (separate from identity storage)
storage:
  type: postgres
  connection_string: "${env:STORAGE_DATABASE_URL:postgresql://localhost:5432/auth_storage}"
